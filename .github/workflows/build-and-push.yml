# Build and push multi-arch Docker images for strapi/base and strapi/strapi.
#
# Platforms: linux/amd64 (existing), linux/arm64 (new — Graviton, CAX, Apple Silicon CI)
#
# Replaces Travis CI (.travis.yml) with GitHub Actions + docker buildx.
# QEMU is used for ARM64 cross-compilation on the GitHub-hosted amd64 runner.
#
# Secrets required (set in repository Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  — Docker Hub username with push rights to strapi/base + strapi/strapi
#   DOCKERHUB_TOKEN     — Docker Hub access token (read/write)
#
# To test locally without pushing:
#   docker buildx create --use
#   docker buildx build --platform linux/amd64,linux/arm64 ./base/alpine

name: Build and push multi-arch images

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      strapi_version:
        description: 'Strapi version to build (e.g. 5.0.0)'
        required: false
        default: 'latest'

env:
  # Override in workflow_dispatch or by setting STRAPI_VERSION env var
  STRAPI_VERSION: ${{ github.event.inputs.strapi_version || 'latest' }}

jobs:
  build-base:
    name: Build strapi/base (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            context: ./base
            suffix: ''
          - variant: alpine
            context: ./base/alpine
            suffix: '-alpine'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push strapi/base:${{ env.NODE_VERSION }}${{ matrix.suffix }}
        uses: docker/build-push-action@v5
        strategy:
          # Build for each supported Node LTS version
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NODE_VERSION=20${{ matrix.suffix == '-alpine' && '-alpine' || '' }}
          tags: |
            strapi/base:20${{ matrix.suffix }}
            ${{ matrix.suffix == '' && 'strapi/base:latest' || 'strapi/base:alpine' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push strapi/base:22${{ matrix.suffix }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NODE_VERSION=22${{ matrix.suffix == '-alpine' && '-alpine' || '' }}
          tags: |
            strapi/base:22${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-strapi:
    name: Build strapi/strapi
    runs-on: ubuntu-latest
    needs: build-base
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push strapi/strapi:${{ env.STRAPI_VERSION }}
        uses: docker/build-push-action@v5
        with:
          context: ./strapi
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_VERSION=20-alpine
            STRAPI_VERSION=${{ env.STRAPI_VERSION }}
          tags: |
            strapi/strapi:${{ env.STRAPI_VERSION }}
            ${{ env.STRAPI_VERSION == 'latest' && 'strapi/strapi:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
